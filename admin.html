<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262422">
<meta name="robots" content="noindex">
<title>メニュー管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{
  --bg:#1d1c1a; --bar:#262422; --panel:#322f2c; --head:#3d3a35; --chip:#45413c; --line:#57524b; --field:#211f1d;
  --text:#f6f2e9; --mute:#a59f93; --accent:#f6b400; --accent-ink:#221b00; --alert:#ff7a5c;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-weight:500;
  background:var(--bg);color:var(--text);line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bar);box-shadow:0 1px 0 #0008}
.bar h1{font-size:18px;font-weight:900;margin-right:auto}
.lnk{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.dirty{font-size:13px;font-weight:700;color:var(--accent)}
.primary{min-height:46px;padding:0 22px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:900}
.note{max-width:920px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:#4a2a22;color:#ffd9cf;font-size:13.5px}
.note.soft{background:var(--panel);color:var(--mute)}

main{max-width:920px;margin:0 auto;padding:6px 12px}
.cat{margin-top:16px;background:var(--panel);border-radius:12px;overflow:hidden}
.cat>header{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px 10px;padding:12px;background:var(--head)}
.f{display:grid;gap:3px;font-size:11.5px;color:var(--mute)}
.f.grow{flex:1 1 160px}
.f.grow input{font-weight:900;font-size:17px}
.f.grp{flex:0 1 130px}
.mv{display:flex;gap:6px}
.mv button{min-width:42px;height:42px;padding:0 10px;border-radius:8px;background:var(--chip);font-weight:700;font-size:14px}
.grip{align-self:center;padding:8px 4px;font-size:20px;color:var(--mute);cursor:grab;touch-action:none;user-select:none}
.item{display:grid;grid-template-columns:auto 68px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px;border-top:1px solid #ffffff12;background:var(--panel)}
.item.off .thumb,.item.off .nm{opacity:.45}
.thumb{grid-column:2;width:68px;height:68px;border-radius:8px;overflow:hidden;background:var(--field);border:1px dashed var(--line);
  display:grid;place-items:center;font-size:11.5px;color:var(--mute);line-height:1.3}
.thumb img{width:100%;height:100%;object-fit:cover}
.main{grid-column:3;display:grid;gap:8px}
.nm{width:100%;font-weight:700}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.yen{display:flex;align-items:center;gap:4px;color:var(--mute)}
.yen input{width:92px;text-align:right}
.ck{display:flex;align-items:center;gap:5px;font-size:13px;color:#d9d3c7}
.item>.mv{grid-column:4}
.more{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border-radius:10px;background:#00000030}
.more .f.wide{grid-column:1/-1}
.more .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.sub{min-height:42px;padding:0 14px;border-radius:8px;background:var(--chip);font-weight:700;font-size:14px}
.danger{color:#ffb4a2}
.add{display:block;width:100%;padding:14px;border-top:1px solid #ffffff12;color:var(--accent);font-weight:700;text-align:left}
.addcat{display:block;width:calc(100% - 24px);max-width:896px;margin:16px auto 0;padding:16px;border-radius:12px;border:1px dashed var(--line);color:var(--accent);font-weight:700}
.empty{padding:14px 12px;font-size:13px;color:var(--mute);border-top:1px solid #ffffff12}
.state{padding:60px 20px;text-align:center;color:var(--mute)}

.gate{position:fixed;inset:0;z-index:30;display:grid;place-content:center;gap:12px;padding:24px;background:var(--bg)}
.gate h2{font-size:22px;font-weight:900}
.gate p{font-size:14px;color:var(--mute);max-width:24em}
.gate input{width:min(320px,80vw)}
.gate .err{color:var(--alert);font-weight:700}
.gate .row{display:flex;gap:10px}
.snack{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,200%);
  display:flex;align-items:center;gap:14px;max-width:92vw;padding:12px 12px 12px 20px;border-radius:14px;
  background:#f6f2e9;color:#231f1a;font-weight:700;font-size:14.5px;box-shadow:0 8px 24px #000a;transition:transform .2s}
.snack.on{transform:translate(-50%,0)}
.snack button{flex:none;min-height:42px;padding:0 16px;border-radius:10px;background:#231f1a;color:#f6f2e9;font-weight:900}
@media (max-width:560px){
  .item{grid-template-columns:auto 60px minmax(0,1fr)}
  .thumb{width:60px;height:60px}
  .item>.mv{grid-column:1/-1;justify-content:flex-end}
  .more{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.snack{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <h1>メニュー管理</h1>
  <span class="dirty" id="dirty" hidden>未保存の変更があります</span>
  <a class="lnk" href="order.html?t=テスト" target="_blank" rel="noopener">注文画面を見る</a>
  <button class="lnk" id="passBtn">パスワード変更</button>
  <button class="primary" id="save" disabled>保存する</button>
</header>
<p class="note" id="passNote" hidden>パスワードが初期設定(0000)のままです。上の「パスワード変更」から変更してください。</p>
<p class="note soft" id="demoNote" hidden>デモ表示中です。保存してもお店のメニューは変わりません。</p>

<main id="cats"><p class="state">メニューを読み込んでいます…</p></main>
<button class="addcat" id="addCat" hidden>＋ カテゴリを追加</button>

<datalist id="groups"></datalist>
<input type="file" id="file" accept="image/*" hidden>

<div class="gate" id="gate" hidden>
  <h2 id="gateTitle">メニュー管理</h2>
  <p id="gateText">管理用パスワードを入力してください。</p>
  <input type="password" id="pw1" autocomplete="current-password" aria-label="パスワード">
  <input type="password" id="pw2" autocomplete="new-password" aria-label="新しいパスワード(確認)" placeholder="もう一度入力" hidden>
  <p class="err" id="gateErr" hidden></p>
  <div class="row"><button class="primary" id="gateGo">ログイン</button><button class="sub" id="gateCancel" hidden>やめる</button></div>
</div>

<div class="snack" id="snack" role="status"><span id="snackText"></span><button id="snackBtn" hidden>元に戻す</button></div>

<script>
/* ===== 設定(config.js で上書き) ===== */
const CFG = Object.assign({ GAS_URL:'', SHOP_NAME:'お店の名前' }, window.MO_CONFIG || {});
const DEMO = !CFG.GAS_URL;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const mem = {};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const sess = {
  get(){ try { return sessionStorage.getItem('mo_admin') || ''; } catch (e) { return ''; } },
  set(v){ try { sessionStorage.setItem('mo_admin', v); } catch (e) {} }
};

const DEMO_MENU = [
  ['f01','フード','名物','出汁巻き玉子',780,'注文を受けてから焼き上げます。','','一番人気',true,false],
  ['f02','フード','名物','鶏の唐揚げ',680,'','','',true,false],
  ['f04','フード','とりあえず','枝豆',380,'','','',false,false],
  ['f06','フード','とりあえず','たたききゅうり',420,'','','',false,true],
  ['d01','ドリンク','ビール','生ビール',620,'','','',false,false],
  ['d03','ドリンク','サワー','レモンサワー',520,'','','おすすめ',false,false],
].map(r => ({ id:r[0], group:r[1], cat:r[2], name:r[3], price:r[4], desc:r[5], img:r[6], badge:r[7], rec:r[8], sold:r[9], hidden:false }));

/* ===== 状態 ===== */
const S = { pass:sess.get(), cats:[], dirty:false, saving:false, target:null, undo:null, gateMode:'login' };

/* ===== 通信 ===== */
async function call(action, extra){
  if (DEMO) {
    if (action === 'adminMenu') return { ok:true, menu:store.get('mo_demo_menu', DEMO_MENU) };
    if (action === 'saveMenu') { store.set('mo_demo_menu', extra.items); return { ok:true, count:extra.items.length }; }
    if (action === 'uploadImage') return { ok:true, url:'data:' + extra.mime + ';base64,' + extra.data };
    return { ok:true };
  }
  const r = await fetch(CFG.GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action, pass:S.pass, ...extra }) });
  const res = await r.json();
  if (res.error === 'unknown action') res.error = 'GAS側が古いままです。新しい Code.gs に差し替えて、新バージョンとして再デプロイしてください。';
  return res;
}

/* ===== 描画 ===== */
function imgFail(el){   /* 写真の配信元を1回だけ切り替えて再試行 */
  const m = el.src.match(/^https:\/\/lh3\.googleusercontent\.com\/d\/([\w-]+)/);
  if (m && !el.dataset.retry) { el.dataset.retry = 1; el.src = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800'; }
  else el.replaceWith('表示できません');
}
const thumbHtml = it => it.busy ? '保存中…' : it.img ? `<img src="${esc(it.img)}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)">` : '＋写真';

function render(){
  const groups = [...new Set(S.cats.map(c => c.group).filter(Boolean))];
  $('#groups').innerHTML = groups.map(g => `<option value="${esc(g)}">`).join('');
  $('#cats').innerHTML = S.cats.length ? S.cats.map((c, ci) => `<section class="cat" data-c="${ci}">
    <header>
      <span class="grip cgrip" hidden aria-hidden="true">⠿</span>
      <label class="f grow">カテゴリ名<input data-cf="name" value="${esc(c.name)}" placeholder="例:名物"></label>
      <label class="f grp">区分<input data-cf="group" list="groups" value="${esc(c.group)}" placeholder="例:フード"></label>
      <div class="mv"><button data-act="cat-up"${ci === 0 ? ' disabled' : ''} aria-label="カテゴリを上へ">↑</button><button data-act="cat-down"${ci === S.cats.length - 1 ? ' disabled' : ''} aria-label="カテゴリを下へ">↓</button><button data-act="cat-del" class="danger">削除</button></div>
    </header>
    <div class="items">${c.items.map((it, ii) => itemHtml(it, ci, ii, c.items.length)).join('')}</div>
    ${c.items.length ? '' : '<p class="empty">商品がありません。商品のないカテゴリは保存されません。</p>'}
    <button class="add" data-act="add">＋ このカテゴリに商品を追加</button>
  </section>`).join('') : '<p class="state">カテゴリがありません。「カテゴリを追加」から始めてください。</p>';
  $('#addCat').hidden = false;
  bindSort();
}
function itemHtml(it, ci, ii, n){
  return `<div class="item${it.hidden ? ' off' : ''}" data-c="${ci}" data-i="${ii}" data-k="${it.k}">
    <span class="grip igrip" hidden aria-hidden="true">⠿</span>
    <button class="thumb" data-act="photo" aria-label="写真を選ぶ">${thumbHtml(it)}</button>
    <div class="main">
      <input class="nm" data-f="name" value="${esc(it.name)}" placeholder="商品名" aria-label="商品名">
      <div class="row2">
        <label class="yen">¥<input data-f="price" inputmode="numeric" value="${esc(it.price)}" aria-label="価格"></label>
        <label class="ck"><input type="checkbox" data-f="rec"${it.rec ? ' checked' : ''}>おすすめ</label>
        <label class="ck"><input type="checkbox" data-f="sold"${it.sold ? ' checked' : ''}>売り切れ</label>
        <label class="ck"><input type="checkbox" data-f="hidden"${it.hidden ? ' checked' : ''}>非表示</label>
      </div>
    </div>
    <div class="mv"><button data-act="up"${ii === 0 ? ' disabled' : ''} aria-label="上へ">↑</button><button data-act="down"${ii === n - 1 ? ' disabled' : ''} aria-label="下へ">↓</button><button data-act="more" aria-expanded="${!!it.open}">詳細</button></div>
    <div class="more"${it.open ? '' : ' hidden'}>
      <label class="f wide">説明(商品を開いたときに表示)<textarea data-f="desc">${esc(it.desc)}</textarea></label>
      <label class="f">写真の上の帯<input data-f="badge" value="${esc(it.badge)}" placeholder="例:本日のおすすめ"></label>
      <label class="f">カテゴリを移動<select data-move>${S.cats.map((c, k) => `<option value="${k}"${k === ci ? ' selected' : ''}>${esc(c.name || '(名前なし)')}${c.group ? ' / ' + esc(c.group) : ''}</option>`).join('')}</select></label>
      <label class="f wide">写真のURL(自分で指定する場合)<input data-f="img" value="${esc(it.img.startsWith('data:') ? '' : it.img)}" placeholder="例:img/dashimaki.jpg"></label>
      <div class="acts"><button class="sub" data-act="photo">写真を選び直す</button><button class="sub" data-act="photo-clear">写真を外す</button><button class="sub danger" data-act="del">この商品を削除</button></div>
    </div>
  </div>`;
}
function refreshLists(){   /* 区分の候補と「カテゴリを移動」の選択肢だけを更新(入力中のカーソルを奪わない) */
  $('#groups').innerHTML = [...new Set(S.cats.map(c => c.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('');
  document.querySelectorAll('select[data-move]').forEach(sel => [...sel.options].forEach((o, k) => {
    const c = S.cats[k]; if (c) o.textContent = (c.name || '(名前なし)') + (c.group ? ' / ' + c.group : ''); }));
}
function refreshThumb(it){
  document.querySelectorAll(`.item[data-k="${it.k}"] .thumb`).forEach(el => { el.innerHTML = thumbHtml(it); });
}
function setDirty(v = true){
  S.dirty = v; $('#dirty').hidden = !v; $('#save').disabled = !v || S.saving; $('#save').textContent = S.saving ? '保存中…' : '保存する';
}

/* ドラッグでの並べ替え(読み込めたときだけ有効。↑↓ボタンは常に使える) */
let catSort = null;
function bindSort(){
  if (!window.Sortable) return;
  document.querySelectorAll('.grip').forEach(g => { g.hidden = false; });
  if (!catSort) catSort = Sortable.create($('#cats'), { handle:'.cgrip', draggable:'.cat', animation:150, onEnd:syncDom });
  document.querySelectorAll('.items').forEach(el => Sortable.create(el, { group:'items', handle:'.igrip', draggable:'.item', animation:150, onEnd:syncDom }));
}
function syncDom(){
  const old = S.cats;
  S.cats = [...document.querySelectorAll('#cats > .cat')].map(sec => ({ ...old[+sec.dataset.c],
    items:[...sec.querySelectorAll('.item')].map(el => old[+el.dataset.c].items[+el.dataset.i]) }));
  setDirty(); render();
}

/* ===== 編集 ===== */
const where = el => { const it = el.closest('.item'), sec = el.closest('.cat'); return { ci:+sec.dataset.c, ii:it ? +it.dataset.i : -1 }; };
$('#cats').addEventListener('input', e => {
  const el = e.target, { ci, ii } = where(el);
  if (el.dataset.cf) { S.cats[ci][el.dataset.cf] = el.value; return setDirty(); }
  const f = el.dataset.f; if (!f || ii < 0) return;
  const it = S.cats[ci].items[ii];
  if (el.type === 'checkbox') { it[f] = el.checked; if (f === 'hidden') el.closest('.item').classList.toggle('off', el.checked); }
  else if (f === 'price') it.price = el.value.replace(/[０-９]/g, d => '０１２３４５６７８９'.indexOf(d)).replace(/[^\d]/g, '');
  else { it[f] = el.value; if (f === 'img') refreshThumb(it); }
  setDirty();
});
$('#cats').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.cf) return refreshLists();
  if (!('move' in el.dataset)) return;
  const { ci, ii } = where(el), to = +el.value; if (to === ci) return;
  S.cats[to].items.push(S.cats[ci].items.splice(ii, 1)[0]); setDirty(); render();
});
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, { ci, ii } = where(b), c = S.cats[ci], it = ii >= 0 ? c.items[ii] : null;
  const swap = (arr, i, j) => { [arr[i], arr[j]] = [arr[j], arr[i]]; setDirty(); render(); };
  if (a === 'up') swap(c.items, ii, ii - 1);
  else if (a === 'down') swap(c.items, ii, ii + 1);
  else if (a === 'cat-up') swap(S.cats, ci, ci - 1);
  else if (a === 'cat-down') swap(S.cats, ci, ci + 1);
  else if (a === 'more') { it.open = !it.open; render(); }
  else if (a === 'add') {
    const n = { k:uid(), id:'', name:'', price:'', desc:'', img:'', badge:'', rec:false, sold:false, hidden:false, open:false };
    c.items.push(n); setDirty(); render();
    document.querySelector(`.item[data-k="${n.k}"] .nm`).focus();
  }
  else if (a === 'del') {
    c.items.splice(ii, 1); S.undo = () => { c.items.splice(Math.min(ii, c.items.length), 0, it); };
    setDirty(); render(); snack(`「${it.name || '名前のない商品'}」を削除しました`, true);
  }
  else if (a === 'cat-del') {
    if (c.items.length) return snack('商品が残っているカテゴリは削除できません。先に商品を移動するか削除してください。');
    S.cats.splice(ci, 1); S.undo = () => { S.cats.splice(Math.min(ci, S.cats.length), 0, c); };
    setDirty(); render(); snack(`カテゴリ「${c.name || '名前なし'}」を削除しました`, true);
  }
  else if (a === 'photo') { S.target = it; $('#file').value = ''; $('#file').click(); }
  else if (a === 'photo-clear') { it.img = ''; setDirty(); render(); }
});
$('#addCat').addEventListener('click', () => {
  const last = S.cats[S.cats.length - 1];
  S.cats.push({ name:'', group:last ? last.group : 'フード', items:[] }); setDirty(); render();
  const inputs = document.querySelectorAll('[data-cf="name"]'); inputs[inputs.length - 1].focus();
});

/* ===== 写真 ===== */
function shrink(file){
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(url); ng(new Error('read')); };
    im.src = url;
  });
}
$('#file').addEventListener('change', async e => {
  const file = e.target.files[0], it = S.target; if (!file || !it) return;
  it.busy = true; refreshThumb(it);
  try {
    const data = await shrink(file);
    const res = await call('uploadImage', { mime:'image/jpeg', data });
    if (!res.ok) { if (res.auth) openGate('login'); throw new Error(res.error); }
    it.img = res.url; setDirty();
  } catch (err) {
    snack(err && err.message && err.message !== 'read' ? err.message : '写真を保存できませんでした。別の写真で試すか、通信状況を確認してください。');
  }
  it.busy = false; render();
});

/* ===== 保存 ===== */
$('#save').addEventListener('click', async () => {
  if (S.saving || !S.dirty) return;
  for (const c of S.cats) {
    if (c.items.length && !c.name.trim()) return snack('カテゴリ名が空のカテゴリがあります。名前を入れてください。');
    if (c.items.some(it => !it.name.trim())) return snack(`「${c.name}」に商品名が空の商品があります。名前を入れるか削除してください。`);
    if (c.items.some(it => it.busy)) return snack('写真の保存が終わってから、もう一度押してください。');
  }
  const items = S.cats.flatMap(c => c.items.map(it => ({ id:it.id, group:c.group.trim(), cat:c.name.trim(), name:it.name.trim(), price:Number(it.price) || 0,
    desc:it.desc, img:it.img, badge:it.badge.trim(), rec:it.rec, sold:it.sold, hidden:it.hidden })));
  S.saving = true; setDirty();
  try {
    const res = await call('saveMenu', { items });
    S.saving = false;
    if (!res.ok) { setDirty(); if (res.auth) return openGate('login'); return snack(res.error || '保存できませんでした。'); }
    setDirty(false); await load(true);
    snack(`保存しました(${res.count}品)。注文画面には1分ほどで反映されます。`);
  } catch (err) { S.saving = false; setDirty(); snack('保存できませんでした。通信状況を確認して、もう一度押してください。'); }
});
addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ===== 読み込み・ログイン ===== */
async function load(quiet){
  try {
    const res = await call('adminMenu');
    if (!res.ok) { if (res.auth) return openGate('login', S.pass ? res.error : ''); throw new Error(res.error); }
    const open = new Set(S.cats.flatMap(c => c.items.filter(i => i.open).map(i => i.id)));
    const map = new Map();
    res.menu.forEach(m => {
      const key = (m.group || '') + '\u0001' + (m.cat || '');
      if (!map.has(key)) map.set(key, { name:m.cat || '', group:m.group || '', items:[] });
      map.get(key).items.push({ k:uid(), id:String(m.id), name:m.name || '', price:m.price ?? '', desc:m.desc || '', img:m.img || '', badge:m.badge || '',
        rec:!!m.rec, sold:!!m.sold, hidden:!!m.hidden, open:open.has(String(m.id)) });
    });
    S.cats = [...map.values()]; $('#gate').hidden = true; $('#passNote').hidden = !res.defaultPass;
    setDirty(false); render();
  } catch (err) {
    if (!quiet) $('#cats').innerHTML = `<p class="state">${esc(err && err.message ? err.message : 'メニューを読み込めませんでした。通信状況を確認して、ページを読み込み直してください。')}</p>`;
  }
}
function openGate(mode, err){
  S.gateMode = mode; const change = mode === 'change';
  $('#gateTitle').textContent = change ? 'パスワード変更' : 'メニュー管理';
  $('#gateText').textContent = change ? '新しいパスワードを2回入力してください(4文字以上)。' : '管理用パスワードを入力してください。';
  $('#gateGo').textContent = change ? '変更する' : 'ログイン';
  $('#pw1').value = ''; $('#pw2').value = ''; $('#pw2').hidden = !change; $('#gateCancel').hidden = !change;
  $('#pw1').autocomplete = change ? 'new-password' : 'current-password';
  $('#gateErr').hidden = !err; $('#gateErr').textContent = err || '';
  $('#gate').hidden = false; $('#pw1').focus();
}
async function gateGo(){
  const v = $('#pw1').value, fail = t => { $('#gateErr').hidden = false; $('#gateErr').textContent = t; };
  if (S.gateMode === 'login') { if (!v) return; S.pass = v; sess.set(v); $('#gateErr').hidden = true; return load(); }
  if (v.length < 4) return fail('4文字以上で入力してください。');
  if (v !== $('#pw2').value) return fail('2回の入力が一致しません。');
  try {
    const res = await call('setPass', { newPass:v });
    if (!res.ok) return fail(res.error || '変更できませんでした。');
    S.pass = v; sess.set(v); $('#gate').hidden = true; $('#passNote').hidden = true; snack('パスワードを変更しました');
  } catch (err) { fail('変更できませんでした。通信状況を確認してください。'); }
}
$('#gateGo').addEventListener('click', gateGo);
$('#gate').addEventListener('keydown', e => { if (e.key === 'Enter') gateGo(); });
$('#gateCancel').addEventListener('click', () => { $('#gate').hidden = true; });
$('#passBtn').addEventListener('click', () => openGate('change'));

function snack(text, undo){
  $('#snackText').textContent = text; $('#snackBtn').hidden = !undo; $('#snack').classList.add('on');
  clearTimeout(snack.t); snack.t = setTimeout(() => { $('#snack').classList.remove('on'); if (undo) S.undo = null; }, undo ? 7000 : 4500);
}
$('#snackBtn').addEventListener('click', () => { if (S.undo) { S.undo(); S.undo = null; setDirty(); render(); } $('#snack').classList.remove('on'); });

document.title = CFG.SHOP_NAME + ' | メニュー管理';
$('#demoNote').hidden = !DEMO;
if (DEMO || S.pass) load(); else openGate('login');
</script>
</body>
