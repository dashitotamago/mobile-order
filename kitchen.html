<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262422">
<meta name="robots" content="noindex">
<title>注文確認(厨房)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<script src="config.js"></script>
<script>/* Firebase版なら、画面の準備と並行してFirebaseの部品を先に読み込み始める(表示を速くする) */
(() => { const c = window.MO_CONFIG || {}; if (!(c.FIREBASE && c.FIREBASE.projectId)) return;
  const add = (rel, href, cors) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (cors) l.crossOrigin = ''; document.head.appendChild(l); };
  ['https://firestore.googleapis.com', 'https://identitytoolkit.googleapis.com', 'https://www.gstatic.com'].forEach(u => add('preconnect', u, true));
  add('modulepreload', 'fb.js');
  ['app', 'auth', 'firestore'].forEach(n => add('modulepreload', 'https://www.gstatic.com/firebasejs/13.3.0/firebase-' + n + '.js'));
})();</script>
</head>
<body data-role="kitchen">

<header class="bar">
  <div class="row1">
    <h1 id="shopName"></h1>
    <p class="count">未調理<b id="nItems">0</b>品 /<b id="nTables">0</b>卓</p>
    <div class="tools">
      <div class="seg" id="view" role="group" aria-label="表示のしかた"><button data-v="table">卓ごと</button><button data-v="order">注文ごと</button></div>
      
    </div>
    <p class="stat" id="stat">接続中…</p>
  </div>
  <nav class="filters" id="filters" aria-label="カテゴリ・商品で絞り込み" hidden></nav>
  <p class="filternote" id="filternote" hidden></p>
</header>

<main class="board" id="board"></main>

<div class="snack" id="snack" role="status"><span id="snackText"></span><button id="snackBtn" hidden>取り消す</button></div>

<div class="gate" id="gate">
  <h2>厨房の受付を始めます</h2>
  <p>ボタンを押すと、新しい注文が入ったときに通知音が鳴るようになります。タブレットの音量を上げておいてください。</p>
  <div class="login" id="login" hidden>
    <input type="email" id="lgEmail" autocomplete="username" placeholder="スタッフ用メールアドレス" aria-label="メールアドレス">
    <input type="password" id="lgPass" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード">
    <p class="lgerr" id="lgErr" hidden></p>
  </div>
  <button class="go" id="start">受付を始める</button>
</div>

<script src="board.js"></script>
</body>
</html>
