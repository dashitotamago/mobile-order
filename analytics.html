<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262422">
<meta name="robots" content="noindex">
<title>商品分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script>/* Firebase版なら、画面の準備と並行してFirebaseの部品を先に読み込み始める */
(() => { const c = window.MO_CONFIG || {}; if (!(c.FIREBASE && c.FIREBASE.projectId)) return;
  const add = (rel, href, cors) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (cors) l.crossOrigin = ''; document.head.appendChild(l); };
  ['https://firestore.googleapis.com', 'https://identitytoolkit.googleapis.com', 'https://www.gstatic.com'].forEach(u => add('preconnect', u, true));
  add('modulepreload', 'fb.js');
  ['app', 'auth', 'firestore'].forEach(n => add('modulepreload', 'https://www.gstatic.com/firebasejs/13.3.0/firebase-' + n + '.js'));
})();</script>
<style>
:root{
  --bg:#1d1c1a; --bar:#262422; --panel:#322f2c; --chip:#45413c; --line:#57524b; --field:#211f1d;
  --grid:#403c37; --base:#57524b;
  --text:#f6f2e9; --sub:#d2ccc0; --mute:#a59f93; --accent:#f6b400; --accent-ink:#221b00; --alert:#ff7a5c;
  --series:#3987e5; --series-hi:#5598e7;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-weight:500;
  background:var(--bg);color:var(--text);line-height:1.45;min-height:100dvh;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bar);box-shadow:0 1px 0 #0008}
.bar h1{font-size:18px;font-weight:900;margin-right:auto}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.stat.off{color:var(--alert);font-weight:700}
.tbtn{min-height:40px;padding:0 14px;border-radius:9px;background:var(--chip);font-weight:700;font-size:14px}

main{max-width:1100px;margin:0 auto;padding:0 14px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:14px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;background:var(--chip);color:#d9d3c7;font-weight:700;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.range{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.period{font-size:13px;color:var(--mute);padding:2px 0 4px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.kpi{background:var(--panel);border-radius:12px;padding:14px 16px}
.kpi p{font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:28px;font-weight:900;line-height:1.2;margin-top:4px}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:2px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.card{background:var(--panel);border-radius:12px;padding:16px;margin-top:12px;min-width:0}
.grid2 .card{margin-top:0}
.card h2{font-size:16px;font-weight:900}
.card .note{font-size:12px;color:var(--mute);margin-top:2px}
.card .body{margin-top:14px;position:relative}
.loading .body,.loading .kpis{opacity:.45;transition:opacity .2s}
.empty{padding:28px 0;text-align:center;color:var(--mute);font-size:14px}

/* 区分の構成(1本の帯) */
.split{display:flex;gap:2px;height:28px}
.split div{border-radius:4px;min-width:2px;display:flex;align-items:center;padding:0 8px;font-size:13px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.split div span{visibility:hidden}
.split div.fit span{visibility:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* 横棒(カテゴリ別) */
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px 10px;align-items:center}
.hbars .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.hbars .track{height:12px}
.hbars .fill{height:12px;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.hbars .v{font-size:14px;text-align:right;white-space:nowrap}
.hbars .pc{font-size:13px;color:var(--mute);text-align:right;min-width:3.6em}

/* 縦棒(時間帯別・日別) */
.cols{position:relative;height:200px;margin-left:44px;margin-top:22px}
.cols .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.cols .gl.base{border-top-color:var(--base)}
.cols .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--mute);white-space:nowrap}
.cols .row{position:absolute;inset:0;display:flex;align-items:flex-end}
.cols .slot{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.cols .slot:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.cols .c{width:min(24px,60%);background:var(--series);border-radius:4px 4px 0 0}
.cols .slot:hover .c,.cols .slot:focus .c{background:var(--series-hi)}
.cols .peak{position:absolute;font-size:11px;color:var(--sub);white-space:nowrap;transform:translateY(-100%);padding-bottom:3px}
.xaxis{display:flex;margin-left:44px;margin-top:6px}
.xaxis span{flex:1;text-align:center;font-size:11px;color:var(--mute);white-space:nowrap;overflow:visible}
.tip{position:fixed;z-index:30;pointer-events:none;background:#f6f2e9;color:#231f1a;border-radius:8px;padding:7px 10px;font-size:13px;box-shadow:0 6px 18px #0009;transform:translate(-50%,calc(-100% - 10px))}
.tip b{display:block;font-size:15px}
details.tv{margin-top:12px;font-size:13px;color:var(--mute)}
details.tv summary{cursor:pointer;display:inline-block;padding:4px 0}
details.tv table{margin-top:8px}

/* ランキング表 */
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:700;color:var(--mute);text-align:right;padding:8px 8px;border-bottom:1px solid var(--base);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #ffffff10;text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
th button{color:inherit;font-weight:700;font-size:12px}
th button[aria-sort]::after{content:" ▼";font-size:10px}
td.nm{font-weight:700;max-width:14em;overflow:hidden;text-overflow:ellipsis}
td.cat{color:var(--mute);font-size:13px}
td.rk{color:var(--mute);width:2.5em}
.minibar{display:inline-block;width:calc(var(--w) * 80px);height:8px;background:var(--series);border-radius:0 3px 3px 0;vertical-align:middle;margin-right:8px;min-width:2px}
.abc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:900;font-size:13px;background:var(--chip);color:var(--sub)}
.abc.A{background:var(--text);color:#231f1a}
.thead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.target{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.target select{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ttiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ttile{background:var(--bg);border-radius:10px;padding:12px 14px}
.ttile p{font-size:13px;color:var(--mute)}
.ttile b{display:block;font-size:26px;font-weight:900;line-height:1.2;margin-top:4px}
.ttile small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
@media (max-width:820px){.ttiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zero{display:flex;flex-wrap:wrap;gap:8px}
.zero span{padding:5px 12px;border-radius:999px;background:var(--chip);font-size:13px;color:var(--sub)}

.gate{position:fixed;inset:0;z-index:40;display:grid;place-content:center;gap:12px;padding:24px;background:var(--bg)}
.gate h2{font-size:22px;font-weight:900}
.gate p{font-size:14px;color:var(--mute);max-width:24em}
.gate input{width:min(320px,80vw)}
.gate .err{color:var(--alert);font-weight:700}
.primary{min-height:50px;padding:0 26px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:900;justify-self:start}

@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){   /* スマホでは列を絞る(見ている基準の列だけ表示) */
  .c-cat,.c-pr{display:none}
  table.by-qty .cs{display:none}
  table.by-sales .cq{display:none}
  td.nm{max-width:7em}
  table{font-size:13px}
  th,td{padding-left:4px;padding-right:4px}
  .minibar{width:calc(var(--w) * 34px);margin-right:5px}
}
@media (max-width:480px){
  main{padding:0 12px}
  .kpi b{font-size:23px}
  .cols{height:170px;margin-left:38px}.xaxis{margin-left:38px}
  .hbars .nm{max-width:6.5em}
}
@media (prefers-reduced-motion:reduce){.loading .body,.loading .kpis{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <h1 id="title">商品分析</h1>
  <p class="stat" id="stat"></p>
  <button class="tbtn" id="reload">最新にする</button>
  <button class="tbtn" id="csv">CSVで保存</button>
</header>

<main id="main">
  <div class="filters">
    <div class="seg" id="periods" role="group" aria-label="期間"></div>
    <div class="range" id="range" hidden>
      <input type="date" id="from" aria-label="開始日"> 〜 <input type="date" id="to" aria-label="終了日">
    </div>
    <div class="seg" id="groups" role="group" aria-label="区分"></div>
    <div class="seg" id="metric" role="group" aria-label="並べ替えの基準">
      <button data-m="qty" aria-pressed="true">出数で見る</button><button data-m="sales" aria-pressed="false">売上で見る</button>
    </div>
  </div>
  <p class="period" id="periodText"></p>

  <section class="kpis" id="kpis" aria-label="期間の合計"></section>

  <section class="card" id="splitCard">
    <h2 id="splitTitle">区分の構成</h2>
    <div class="body" id="split"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2 id="catTitle">カテゴリ別</h2>
      <p class="note">カテゴリごとの合計と構成比</p>
      <div class="body" id="cats"></div>
    </section>
    <section class="card">
      <h2 id="hourTitle">時間帯別</h2>
      <p class="note" id="hourNote"></p>
      <div class="body" id="hours"></div>
    </section>
  </div>

  <section class="card">
    <h2>商品ランキング</h2>
    <p class="note">構成比は期間内の合計に対する割合。ABCは売上の多い順に累計して、70%までをA、90%までをB、残りをCとしています。売上はすべて税抜です。</p>
    <div class="body tblwrap" id="rank"></div>
  </section>

  <section class="card" id="timeCard">
    <div class="thead"><h2>提供時間</h2>
      <label class="target">目標
        <select id="target" aria-label="提供時間の目標(分)"></select>分以内</label></div>
    <p class="note" id="timeNote"></p>
    <div class="body" id="times"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>商品別の提供時間</h2>
      <p class="note">注文から提供までの平均が長い順</p>
      <div class="body tblwrap" id="timeItems"></div>
    </section>
    <section class="card">
      <h2>時間帯別の提供時間</h2>
      <p class="note">注文から提供までの平均(分)</p>
      <div class="body" id="timeHours"></div>
    </section>
  </div>

  <section class="card" id="dayCard">
    <h2 id="dayTitle">日別の推移</h2>
    <div class="body" id="days"></div>
  </section>

  <section class="card" id="zeroCard">
    <h2>期間中に出ていない商品</h2>
    <p class="note">メニューに表示中で、この期間に1つも注文がなかった商品</p>
    <div class="body" id="zero"></div>
  </section>
</main>

<div class="tip" id="tip" hidden></div>

<div class="gate" id="gate" hidden>
  <h2>商品分析</h2>
  <p>スタッフ用アカウントでログインしてください。この端末では次回から入力不要になります。</p>
  <input type="email" id="em" autocomplete="username" placeholder="スタッフ用メールアドレス" aria-label="メールアドレス">
  <input type="password" id="pw" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード">
  <p class="err" id="gateErr" hidden></p>
  <button class="primary" id="gateGo">ログイン</button>
</div>

<script>
/* ===== 設定(config.js で上書き) ===== */
const CFG = Object.assign({ GAS_URL:'', FIREBASE:null, SHOP_NAME:'お店の名前', TAX_RATE:0.10, TAX_ROUND:'floor', DAY_START_HOUR:4, LATE_MIN:20 }, window.MO_CONFIG || {});
const MODE = CFG.FIREBASE && CFG.FIREBASE.projectId ? 'fb' : 'demo';
const FBP = MODE === 'fb' ? import('./fb.js') : null;
const DAY0 = Math.min(Math.max(Number(CFG.DAY_START_HOUR) || 0, 0), 12);   /* 営業日の区切り(この時刻より前は前日扱い) */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const n0 = n => Math.round(Number(n) || 0).toLocaleString('ja-JP');
const yen = n => n0(n) + '円';
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '-';
const TAX_PM = Math.round((Number(CFG.TAX_RATE) || 0) * 1000);
const TAX_RND = { floor:Math.floor, ceil:Math.ceil, round:Math.round }[CFG.TAX_ROUND] || Math.floor;
const DAY = 864e5;
const WD = ['日', '月', '火', '水', '木', '金', '土'];

/* ===== 期間 ===== */
/* 営業日の開始時刻(その日の DAY0 時) */
const bizStart = d => { const x = new Date(d); x.setHours(DAY0, 0, 0, 0); return x.getTime(); };
const bizToday = () => { const n = new Date(Date.now() - DAY0 * 3600e3); n.setHours(0, 0, 0, 0); return n; };
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const md = d => { const x = new Date(d); return (x.getMonth() + 1) + '/' + x.getDate(); };
const PERIODS = [
  ['today', '今日'], ['yesterday', '昨日'], ['week', '今週'], ['month', '今月'], ['last', '先月'], ['d30', '過去30日'], ['custom', '期間指定']
];
function rangeOf(key){
  const t = bizToday(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  const day = (yy, mm, dd) => bizStart(new Date(yy, mm, dd));
  if (key === 'today') return [day(y, m, d), day(y, m, d + 1)];
  if (key === 'yesterday') return [day(y, m, d - 1), day(y, m, d)];
  if (key === 'week') { const back = (t.getDay() + 6) % 7; return [day(y, m, d - back), day(y, m, d + 1)]; }   /* 月曜はじまり */
  if (key === 'month') return [day(y, m, 1), day(y, m, d + 1)];
  if (key === 'last') return [day(y, m - 1, 1), day(y, m, 1)];
  if (key === 'd30') return [day(y, m, d - 29), day(y, m, d + 1)];
  const f = $('#from').value, to = $('#to').value;
  if (!f || !to) return null;
  const [a, b] = f <= to ? [f, to] : [to, f];
  const A = a.split('-').map(Number), B = b.split('-').map(Number);
  return [day(A[0], A[1] - 1, A[2]), day(B[0], B[1] - 1, B[2] + 1)];
}

/* ===== 状態 ===== */
const S = { period:'month', group:'all', metric:'qty', late:Number(CFG.LATE_MIN) || 20, menu:[], lines:[], range:null, cache:new Map(), loading:false, sortKey:null };
const mem = {};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
(() => { const p = store.get('mo_an_prefs', null); if (p) { S.period = p.period || S.period; S.metric = p.metric || S.metric; S.late = Number(p.late) || S.late; } })();
const savePrefs = () => store.set('mo_an_prefs', { period:S.period, metric:S.metric, late:S.late });

/* ===== デモ用データ(Firebase未設定のとき) ===== */
const DEMO_MENU = [
  ['f01','フード','名物','出汁巻き玉子',780],['f02','フード','名物','鶏の唐揚げ',680],['f03','フード','名物','ポテトサラダ',480],
  ['f04','フード','とりあえず','枝豆',380],['f05','フード','とりあえず','冷奴',380],['f06','フード','とりあえず','たたききゅうり',420],
  ['f07','フード','刺身','刺身三種盛り',1280],['f08','フード','刺身','〆さば',780],['f09','フード','焼き物','焼き鳥盛り合わせ',980],
  ['f10','フード','焼き物','ほっけの開き',1080],['f11','フード','ご飯・〆','鮭茶漬け',580],['f12','フード','ご飯・〆','焼きおにぎり',420],
  ['f13','フード','ご飯・〆','土鍋鯛めし',1480],
  ['d01','ドリンク','ビール','生ビール',620],['d02','ドリンク','ビール','瓶ビール',720],['d03','ドリンク','サワー','レモンサワー',520],
  ['d04','ドリンク','サワー','ハイボール',520],['d05','ドリンク','サワー','梅干しサワー',550],['d06','ドリンク','ソフトドリンク','烏龍茶',350],['d07','ドリンク','ソフトドリンク','コーラ',350]
].map(r => ({ id:r[0], group:r[1], cat:r[2], name:r[3], price:r[4], hidden:false }));
function demoLines(from, to){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const w = { f01:9, f02:7, f03:4, f04:6, f05:2, f06:3, f07:5, f08:1.5, f09:5, f10:2, f11:2, f12:1.5, f13:0, d01:10, d02:1.5, d03:7, d04:6, d05:2, d06:3, d07:1.5 };
  const ids = Object.keys(w), sum = ids.reduce((a, k) => a + w[k], 0);
  const pick = () => { let r = rnd() * sum; for (const k of ids) { r -= w[k]; if (r <= 0) return k; } return ids[0]; };
  const hourW = [[11, 3], [12, 6], [13, 4], [14, 1], [17, 2], [18, 5], [19, 7], [20, 6], [21, 3], [22, 1.5], [23, .6]];
  const hsum = hourW.reduce((a, h) => a + h[1], 0);
  const hour = () => { let r = rnd() * hsum; for (const h of hourW) { r -= h[1]; if (r <= 0) return h[0]; } return 19; };
  const out = [], start = bizStart(new Date(Date.now() - 80 * DAY));
  for (let d = start; d < Date.now(); d += DAY) {
    const wd = new Date(d).getDay(), groups = Math.round((wd === 0 || wd === 6 ? 34 : 20) * (0.75 + rnd() * .5));
    for (let g = 0; g < groups; g++) {
      const base = new Date(d); base.setHours(hour(), Math.floor(rnd() * 60), 0, 0);
      const pay = 'p' + d + '_' + g, n = 2 + Math.floor(rnd() * 5);
      for (let i = 0; i < n; i++) {
        const id = pick(), m = DEMO_MENU.find(x => x.id === id), at = base.getTime() + i * 9 * 60000;
        if (at >= Date.now()) continue;
        const drink = m.group === 'ドリンク', busy = [12, 19, 20].includes(new Date(at).getHours()) ? 1.5 : 1;
        const cookedAt = at + Math.round((drink ? 1.5 + rnd() * 3 : 5 + rnd() * 12) * busy * 60000), servedAt = cookedAt + Math.round((0.5 + rnd() * 4) * 60000);
        out.push({ id, name:m.name, price:m.price, qty:1 + (rnd() < .2 ? 1 : 0), at, cookedAt, servedAt, paid:true, payId:pay, table:String(1 + g % 8) });
      }
    }
  }
  return out.filter(l => l.at >= from && l.at < to);
}

/* ===== 読み込み ===== */
async function fetchLines(range, force){
  const key = range.join('-');
  if (!force && S.cache.has(key)) return S.cache.get(key);
  const lines = MODE === 'fb' ? await (await FBP).getLines(range[0], range[1]) : demoLines(range[0], range[1]);
  S.cache.set(key, lines);
  return lines;
}
async function load(force){
  const range = rangeOf(S.period);
  renderFilters();
  if (!range) { $('#periodText').textContent = '開始日と終了日を選んでください。'; return; }
  S.range = range; S.loading = true; $('#main').classList.add('loading');
  $('#stat').className = 'stat'; $('#stat').textContent = '読み込み中…';
  try {
    if (MODE === 'fb' && (force || !S.menu.length)) S.menu = await (await FBP).getMenu();
    if (MODE === 'demo') S.menu = DEMO_MENU;
    S.lines = await fetchLines(range, force);
    $('#stat').textContent = (MODE === 'demo' ? 'デモ表示中 ' : '') + new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' }) + ' 時点';
  } catch (e) {
    $('#stat').className = 'stat off';
    $('#stat').textContent = e && e.code === 'permission-denied' ? 'このアカウントでは表示できません' : '読み込めませんでした。通信状況を確認してください';
  }
  S.loading = false; $('#main').classList.remove('loading');
  render();
}

/* ===== 集計 ===== */
function aggregate(){
  const info = new Map(S.menu.map(m => [String(m.id), m]));
  const meta = l => { const m = info.get(String(l.id)); return m ? { group:m.group || '', cat:m.cat || 'その他', name:m.name } : { group:'', cat:'(メニューにない商品)', name:l.name }; };
  /* 席料は商品の分析には含めず、売上・組単価にだけ含める(区分で絞り込んだときは含めない) */
  const amt = l => (Number(l.price) || 0) * (Number(l.qty) || 0);
  const seats = S.group === 'all' ? S.lines.filter(l => l.seat) : [];
  const seatSales = seats.reduce((a, l) => a + amt(l), 0);
  const lines = S.lines.filter(l => !l.seat).map(l => ({ ...l, ...meta(l), sales:amt(l) }))
    .filter(l => S.group === 'all' || l.group === S.group);
  const items = new Map(), cats = new Map(), groups = new Map();
  const add = (map, k, l, extra) => { const x = map.get(k) || { key:k, qty:0, sales:0, ...extra }; x.qty += l.qty; x.sales += l.sales; map.set(k, x); };
  lines.forEach(l => {
    add(items, String(l.id), l, { name:l.name, cat:l.cat, group:l.group, price:l.price });
    add(cats, l.cat, l, { group:l.group });
    add(groups, l.group || 'その他', l, {});
  });
  const tot = { qty:lines.reduce((a, l) => a + l.qty, 0), sales:lines.reduce((a, l) => a + l.sales, 0) };
  const paidAll = [...lines, ...seats.map(l => ({ ...l, sales:amt(l) }))].filter(l => l.paid && l.payId);
  const pays = new Set(paidAll.map(l => l.payId));
  const paidSales = paidAll.reduce((a, l) => a + l.sales, 0);
  /* ABC(売上の多い順に累計) */
  let cum = 0;
  [...items.values()].sort((a, b) => b.sales - a.sales).forEach(it => {
    const before = tot.sales ? cum / tot.sales : 0;
    it.abc = before < .7 ? 'A' : before < .9 ? 'B' : 'C';
    cum += it.sales; it.cum = tot.sales ? cum / tot.sales : 0;
  });
  /* 時間帯(営業日の区切りから並べる) */
  const hours = Array.from({ length:24 }, (_, i) => ({ h:(DAY0 + i) % 24, qty:0, sales:0 }));
  lines.forEach(l => { const h = new Date(l.at).getHours(); const x = hours[(h - DAY0 + 24) % 24]; x.qty += l.qty; x.sales += l.sales; });
  /* 日別(長い期間は月別) */
  const spanDays = Math.round((S.range[1] - S.range[0]) / DAY);
  let days = [];
  if (spanDays > 62) {
    const mm = new Map();
    lines.forEach(l => { const d = new Date(l.at - DAY0 * 3600e3), k = d.getFullYear() * 100 + d.getMonth(); const x = mm.get(k) || { label:(d.getMonth() + 1) + '月', full:d.getFullYear() + '年' + (d.getMonth() + 1) + '月', k, qty:0, sales:0 }; x.qty += l.qty; x.sales += l.sales; mm.set(k, x); });
    days = [...mm.values()].sort((a, b) => a.k - b.k);
  } else {
    for (let t = S.range[0]; t < S.range[1]; t += DAY) {
      const d = new Date(t);
      days.push({ t, label:md(d), full:md(d) + '(' + WD[d.getDay()] + ')', qty:0, sales:0 });
    }
    lines.forEach(l => { const i = Math.floor((l.at - S.range[0]) / DAY); if (days[i]) { days[i].qty += l.qty; days[i].sales += l.sales; } });
  }
  const sold = new Set(items.keys());
  const zero = S.menu.filter(m => !m.hidden && !sold.has(String(m.id)) && (S.group === 'all' || m.group === S.group));
  const groupOrder = [...new Set(S.menu.map(m => m.group || 'その他'))];
  /* 提供時間(分)。調理済・提供済の時刻が記録されている商品だけで計算する */
  const dur = (a, b) => a && b && b >= a ? (b - a) / 60000 : null;
  const tl = lines.map(l => ({ l, c:dur(l.at, l.cookedAt), s:dur(l.cookedAt, l.servedAt), t:dur(l.at, l.servedAt) }));
  const stat = arr => { const v = arr.filter(x => x !== null).sort((a, b) => a - b); if (!v.length) return null;
    return { n:v.length, avg:v.reduce((a, x) => a + x, 0) / v.length, med:v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2 }; };
  const late = S.late, totals = tl.filter(x => x.t !== null);
  const time = { c:stat(tl.map(x => x.c)), s:stat(tl.map(x => x.s)), t:stat(tl.map(x => x.t)), late,
    within:totals.length ? totals.filter(x => x.t <= late).length / totals.length : null };
  const byItem = new Map();
  tl.forEach(x => { const k = String(x.l.id); const o = byItem.get(k) || { name:x.l.name, c:[], s:[], t:[] }; o.c.push(x.c); o.s.push(x.s); o.t.push(x.t); byItem.set(k, o); });
  time.items = [...byItem.values()].map(o => ({ name:o.name, c:stat(o.c), s:stat(o.s), t:stat(o.t) })).filter(o => o.t || o.c).sort((a, b) => ((b.t || b.c).avg) - ((a.t || a.c).avg));
  const hb = Array.from({ length:24 }, (_, i) => ({ h:(DAY0 + i) % 24, v:[] }));
  totals.forEach(x => hb[(new Date(x.l.at).getHours() - DAY0 + 24) % 24].v.push(x.t));
  time.hours = hb.map(x => ({ h:x.h, avg:x.v.length ? x.v.reduce((a, y) => a + y, 0) / x.v.length : 0, n:x.v.length }));
  return { tot, seatSales, pays:pays.size, paidSales, items:[...items.values()], cats:[...cats.values()], groups, groupOrder, hours, days, spanDays, zero, time };
}

/* 縦棒グラフ(1系列)。値は目盛り・ツールチップ・表で読める */
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const tick = v => S.metric === 'sales' && v >= 10000 ? (v / 10000).toLocaleString('ja-JP') + '万' : n0(v);
function columns(data, kind, f = fmt, tk = tick, colName = metricName()){
  const max = niceMax(Math.max(...data.map(d => d.v), 0)), peak = data.reduce((a, d, i) => d.v > data[a].v ? i : a, 0);
  const every = Math.max(1, Math.ceil(data.length / (innerWidth < 520 ? 7 : 14)));   /* 目盛りの文字が重ならないよう間引く */
  const gl = [0, .5, 1].map(g => `<div class="gl${g === 0 ? ' base' : ''}" style="bottom:${g * 100}%"><span class="num">${tk(max * g)}</span></div>`).join('');
  const bars = data.map((d, i) => `<div class="slot" tabindex="0" data-tip="${esc(d.full)}|${esc(f(d.v))}" aria-label="${esc(d.full)} ${esc(f(d.v))}">
      ${i === peak && d.v > 0 ? `<span class="peak num" style="bottom:${d.v / max * 100}%">${esc(f(d.v))}</span>` : ''}
      <div class="c" style="height:${d.v / max * 100}%${d.v > 0 ? ';min-height:2px' : ''}"></div></div>`).join('');
  const xs = data.map((d, i) => `<span>${i % every === 0 ? esc(d.label) : ''}</span>`).join('');
  const table = `<details class="tv"><summary>数値を表で見る</summary><table><thead><tr><th class="l">${kind === 'hour' ? '時間帯' : '日付'}</th><th>${esc(colName)}</th></tr></thead>
    <tbody>${data.map(d => `<tr><td class="l">${esc(d.full)}</td><td class="num">${esc(f(d.v))}</td></tr>`).join('')}</tbody></table></details>`;
  return `<div class="cols">${gl}<div class="row">${bars}</div></div><div class="xaxis">${xs}</div>${table}`;
}

/* ツールチップ(棒・帯にマウスを乗せる/タップ/キーボードで選ぶと値を表示) */
const tip = $('#tip');
function showTip(el){
  const [label, val] = el.dataset.tip.split('|'), r = el.getBoundingClientRect();
  tip.innerHTML = `<b class="num">${val}</b>${label}`;   /* 値・ラベルは esc 済み */
  const c = el.querySelector('.c'), top = c ? c.getBoundingClientRect().top : r.top;
  tip.style.left = Math.min(Math.max(r.left + r.width / 2, 70), innerWidth - 70) + 'px';
  tip.style.top = Math.max(top, 60) + 'px'; tip.hidden = false;
}
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });

/* 提供時間の目標(何分以内に提供できたか)。端末ごとに覚える */
(() => {
  const opts = [3, 5, 7, 10, 12, 15, 20, 25, 30, 40, 45, 60];
  if (!opts.includes(S.late)) opts.push(S.late), opts.sort((a, b) => a - b);
  $('#target').innerHTML = opts.map(m => `<option value="${m}"${m === S.late ? ' selected' : ''}>${m}</option>`).join('');
  $('#target').addEventListener('change', e => { S.late = Number(e.target.value); savePrefs(); render(); });
})();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (A) render(); }, 200); });

/* CSV(Excelでそのまま開けるように先頭にBOMを付ける) */
$('#csv').addEventListener('click', () => {
  if (!A) return;
  const its = [...A.items].sort((a, b) => b[S.metric] - a[S.metric]);
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['順位', '商品', '区分', 'カテゴリ', '単価(税抜)', '出数', '出数構成比(%)', '売上(税抜)', '売上構成比(%)', 'ABC']]
    .concat(its.map((it, i) => [i + 1, it.name, it.group, it.cat, it.price, it.qty,
      A.tot.qty ? (it.qty / A.tot.qty * 100).toFixed(1) : 0, it.sales, A.tot.sales ? (it.sales / A.tot.sales * 100).toFixed(1) : 0, it.abc]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `商品分析_${ymd(S.range[0])}_${ymd(S.range[1] - 1)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ===== ログインと起動 ===== */
async function gateGo(){
  const v = $('#pw').value; if (!v) return;
  const r = await (await FBP).login($('#em').value, v);
  if (!r.ok) { $('#gateErr').hidden = false; $('#gateErr').textContent = r.code === 'login' ? 'メールアドレスかパスワードが違います。' : r.code === 'many' ? '何度も間違えたため一時的にログインできません。少し待ってから試してください。' : 'ログインできませんでした。通信状況を確認してください。'; }
}
$('#gateGo').addEventListener('click', gateGo);
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') gateGo(); });

$('#title').textContent = CFG.SHOP_NAME + ' 商品分析'; document.title = CFG.SHOP_NAME + ' | 商品分析';
renderFilters();
if (MODE === 'fb') {
  let started = false;
  FBP.then(fb => fb.watchStaff(u => {
    if (u) { $('#gate').hidden = true; if (!started) { started = true; load(); } }
    else { $('#gateErr').hidden = true; $('#gate').hidden = false; $('#em').focus(); }
  })).catch(() => { $('#stat').className = 'stat off'; $('#stat').textContent = '読み込めませんでした。fb.js がGitHubにあるか確認してください'; });
} else load();
</script>
</body>
</html>
